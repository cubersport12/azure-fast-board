name: Release Windows

on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - '.gitignore'
      - '.vscode/**'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-windows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build Windows installer
    runs-on: windows-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build installer
        run: npm run build
        env:
          # Unsigned CI builds; release upload is handled by softprops/action-gh-release.
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'

      - name: Read app version
        id: version
        shell: pwsh
        run: |
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          "version=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          Get-ChildItem -Recurse release | Select-Object FullName, Length

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Azure-Fast-Board-Windows-v${{ steps.version.outputs.version }}
          path: |
            frontend/release/**/*.exe
          if-no-files-found: error
          retention-days: 30

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}-build.${{ github.run_number }}
          name: Azure Fast Board v${{ steps.version.outputs.version }} (build ${{ github.run_number }})
          body: |
            Автосборка с ветки `main` (`${{ github.sha }}`).

            Скачайте `.exe` ниже:
            - **Setup / NSIS** — установка
            - **portable** — можно запустить без установки
          files: |
            frontend/release/**/*.exe
          fail_on_unmatched_files: true
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
